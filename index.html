function star(x,y,r,c){const p=[];for(let i=0;i<10;i++){const a=-1.5708+i*.6283,q=i%2?r*.46:r;p.push([x+Math.cos(a)*q,y+Math.sin(a)*q])}poly(p,c)}
function flash(x,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,0,8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,0,4,0,7);ctx.fill()}

/* ---------- el: govdeye degen, silah elde ---------- */
function drawWeaponBody(w,px,py,f){
  const hr=hrad(),sw=P.sw,th=P.th;
  ctx.save();ctx.translate(px,py+3);
  let ang=P.aim,ext=0;
  if(w.ml&&sw&&w.n!='Tantō')ang+=(1-sw.t/.2-.5)*2.6*f;
  ctx.rotate(ang);if(f<0)ctx.scale(1,-1);
  if(w.n=='Tantō'&&th&&th.kind=='stab'){const k=1-th.t/th.m;ext=(k<.3?Math.sin(k/.3*1.5708):Math.cos((k-.3)/.7*1.5708))*Math.min(36,th.len*.32)}
  if(ext>1){ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(hr-1,0);ctx.lineTo(hr+ext,0);ctx.stroke();ctx.strokeStyle=hcol();ctx.lineWidth=4;ctx.stroke()}
  ctx.translate(hr+ext,0);
  const d=WD[w.n];
  const wv=(w.n=='Sopa'||w.n=='Motorlu Testere')?Object.assign({},w,{L:w.L*SCL(P.wl[P.W])}):w;if(d)d[0](wv);else{rb(0,-4,w.L,8,w.col,3);rb(w.L,-3,5,6,w.c,2)}
  disc(0,1,5.3,hcol());
  if(P.mf>0){ctx.globalAlpha=Math.min(1,P.mf/.07);flash(d&&d[1]?d[1]:w.L+12,w.c);ctx.globalAlpha=1}
  ctx.restore();
}

/* ---------- boksor: eldivenler, duz yumruk ve kroşe animasyonu ---------- */
function arm(x0,y0,x1,y1,c){ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=8.5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=4.5;ctx.stroke()}
function glove(x,y,ang){ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.beginPath();ctx.roundRect(-11,-5.5,7,11,2);ctx.fillStyle='#f4f4f4';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();
  ctx.beginPath();ctx.arc(2,0,8.4,0,7);ctx.fillStyle='#e84a4a';ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-6.6,4.4,2.8,.15,0,7);ctx.fillStyle='#ff7a7a';ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(5,-2.6,3.4,2,0,0,7);ctx.fill();ctx.restore()}
function drawBoxer(px,py,f){
  const a=P.aim,hr=hrad(),cx0=px,cy0=py+3,skin=hcol(),th=P.th,hk=P.hk;
  for(const h of[0,1]){
    const sg=h?1:-1;
    let ga=a+sg*.7,gd=hr+4;
    if(th&&th.kind=='jab'&&th.h==h){const k=1-th.t/th.m,e=k<.38?Math.sin(k/.38*1.5708):Math.cos((k-.38)/.62*1.5708);ga=a+sg*.7*(1-e);gd=hr+4+e*(th.len-hr-12)}
    else if(hk&&hk.h==h){const k=1-hk.t/hk.m,e=Math.sin(Math.min(1,k)*3.1416);ga=hk.a+sg*hk.ar*(1-2*Math.min(1,k));gd=hr+4+e*hk.rad*.5}
    const gx=cx0+Math.cos(ga)*gd,gy=cy0+Math.sin(ga)*gd,sx=cx0+Math.cos(a+sg*1.57)*9,sy=cy0+Math.sin(a+sg*1.57)*9;
    arm(sx,sy,gx,gy,skin);
    glove(gx,gy,Math.atan2(gy-sy,gx-sx));
  }
}

/* ---------- duz (cizgi) vurus: hasar dikdortgeni ---------- */
const meleeD=(w,m)=>P.dmg*w.dm*(m||1)*dmgMul()*(P.rg>0?1.8:1)*(1+.22*(P.wl[P.W]||0));
const reach=b=>b*(P.range/340)*(1+.08*(P.wl[P.W]||0))*(P.rg>0&&P.ci==9?1.3:1);
function thrust(a,len,wd,d0,o){o=o||{};const dx=Math.cos(a),dy=Math.sin(a),dur=o.t||.2;
  P.th={t:dur,m:dur,a,len,wd,kind:o.kind||'stab',h:o.h||0,col:o.col||'#fff'};
  let n=0;
  for(const e of E){const rx=e.x-P.x,ry=e.y-P.y,al=rx*dx+ry*dy,pe=Math.abs(-rx*dy+ry*dx);
    if(al>-e.r*.3&&al<len+e.r&&pe<wd+e.r){n++;const cr=Math.random()<P.crit;dmgE(e,d0*(cr?P.critd:1),cr,dx*(o.kn||500),dy*(o.kn||500),1);if(P.k.chainlife)lsHeal(.5*P.k.chainlife);if(o.each)o.each(e)}}
  for(const b of EB){const rx=b.x-P.x,ry=b.y-P.y,al=rx*dx+ry*dy,pe=Math.abs(-rx*dy+ry*dx);if(al>0&&al<len+10&&pe<wd+10){b.l=0;sparks(b.x,b.y,a,5,'#fff')}}
  sparks(P.x+dx*len,P.y+dy*len,a,n?7:3,o.col||'#fff',.25);noise(.06,.08);tone(o.s1||320,o.s2||90,.09,'sawtooth',.06);
  sh=Math.max(sh,n?(o.sh||3):1);if(n&&o.hs)hstop=Math.max(hstop,o.hs);return n}

/* Naoki: tanto duz batis */
const _swing=swing;
swing=function(w,a){if(w.n=='Tantō'){thrust(a,reach(w.rad||120),13,meleeD(w),{kind:'stab',t:.2,kn:550,col:'#e8eef8',s1:900,s2:250,sh:3});return}return _swing(w,a)};

/* Tekeshi: duz yumruk (cizgi) + kroşe (genis yay) */
boxAtk=function(w,a){
  P.bx=!P.bx;const jab=P.bx,k=P.k;
  if(jab){
    const len=reach(100);P.jh=P.jh?0:1;
    thrust(a,len,15,meleeD(w,.95),{kind:'jab',h:P.jh,t:.24,kn:650,col:'#f88',s1:260,s2:70,sh:3,hs:.02});
    P.cd*=1.22;
    const ex=P.x+Math.cos(a)*len,ey=P.y+Math.sin(a)*len;
    if(k.delayw)Z.push({x:ex,y:ey,t:.6,m:.6,d:P.dmg*3,r:90});
    if(k.crater)expl(ex,ey,100,P.dmg*2,'#fa4');
  }else{
    const ww=Object.assign({},w,{arc:k.circhook?3.2:1.7,rad:95,dm:w.dm*1.2});
    _swing(ww,a);P.hh=P.hh?0:1;
    P.hk={t:.28,m:.28,a,ar:Math.min(2.2,ww.arc),h:P.hh,rad:95*(P.range/340)};
    P.cd*=1.05;
    if(k.sparks)sparks(P.x,P.y,a,10,'#ff0',.4);
  }};

/* Ruh Ustasi: imlec yonune duz ruh yumrugu */
standAtk=function(a){
  const w=WP[P.W],d0=P.dmg*w.dm*dmgMul()*(1+.22*(P.wl[P.W]||0)),wide=P.k.ora?1.4:1,len=reach(150),tx=P.x+Math.cos(a)*len,ty=P.y+Math.sin(a)*len;
  if(P.k.sarrow){B.push({x:P.x-Math.cos(a)*18,y:P.y-12,vx:Math.cos(a)*850,vy:Math.sin(a)*850,d:d0*.6,cr:Math.random()<P.crit,p:1+P.pierce,l:.7,h:new Set(),ex:0,s:1.1,col:'#a78bff',rc:0});play('hit');ring(P.x-Math.cos(a)*18,P.y-12,4,30,.15,'#a78bff')}
  else{thrust(a,len,24*wide,d0,{kind:'stand',t:.28,kn:800,col:'#a78bff',s1:250,s2:60,sh:5,hs:.03});ring(tx,ty,8,36*wide,.2,'#a78bff');burst(tx,ty,8,'#a78bff',200,.25);play('boom');if(P.k.quakep)expl(tx,ty,120,d0*.5,'#a78bff')}
  if(P.k.trapz)for(const e of E)if(HY(e.x-tx,e.y-ty)<110)e.sl=2};

/* Ultra K1: F = parry (5 sn). Saldiri varsa yansitir, yoksa en yakin dusmana yumruk */
punch=function(){
  if(P.ci!=6)return;
  if((P.pcdT||0)>0){dtx(P.x,P.y-38,Math.ceil(P.pcdT)+' sn','#9cf');return}
  const Rg=(P.k.pullp?280:190)*(P.range/340),pm=P.k.parry3?3:1.5;
  const bl=EB.filter(b=>HY(b.x-P.x,b.y-P.y)<Rg);
  const hot=E.filter(e=>(D(P,e)<Rg&&e.dt>0)||D(P,e)<e.r+34);
  let did=0;
  if(bl.length||hot.length){
    for(const b of bl){let o=null,bd=1e9;for(const e of E){const q=D(b,e);if(q<bd){bd=q;o=e}}const an=o?Math.atan2(o.y-b.y,o.x-b.x):Math.atan2(-b.vy,-b.vx);b.l=0;
      B.push({x:b.x,y:b.y,vx:Math.cos(an)*900,vy:Math.sin(an)*900,d:P.dmg*3*pm,cr:1,p:2,l:1.4,h:new Set(),ex:0,s:1.5,col:'#ffd34d',rc:0,hm:1})}
    for(const e of hot){const an=Math.atan2(e.y-P.y,e.x-P.x),bs=e.k=='B';e.dt=0;if(e.t>2)e.t=0;e.kx+=Math.cos(an)*(bs?200:900);e.ky+=Math.sin(an)*(bs?200:900);e.sl=Math.max(e.sl||0,1.5);dmgE(e,P.dmg*4*pm,1,Math.cos(an)*300,Math.sin(an)*300,1)}
    P.pry={t:.35,m:.35};P.inv=Math.max(P.inv,.45);ring(P.x,P.y,10,110,.3,'#ffd34d');burst(P.x,P.y,18,'#ffd34d',280,.4);hstop=.08;sh=Math.max(sh,8);play('crit');dtx(P.x,P.y-38,'YANSITILDI!','#ffd34d',1);did=1;
  }else{
    let n=null,bd=1e9;for(const e of E){const q=D(P,e);if(q<bd&&q<Rg+e.r){bd=q;n=e}}
    if(!n){dtx(P.x,P.y-38,'Menzilde düşman yok','#9cf');return}
    const an=Math.atan2(n.y-P.y,n.x-P.x),len=Math.min(Rg,bd+n.r+8);P.aim=an;
    thrust(an,len,22,P.dmg*5*(P.k.blood?1.3:1),{kind:'fist',t:.26,kn:900,col:'#ffd34d',s1:200,s2:50,sh:7,hs:.05,each:e=>{if(P.k.pullp){e.x-=(e.x-P.x)*.4;e.y-=(e.y-P.y)*.4}}});
    play('boom');if(P.k.blood)expl(P.x+Math.cos(an)*len,P.y+Math.sin(an)*len,90,P.dmg*2,'#f33');did=1;
  }
  if(did){P.pcdT=P.k.wings?0:5;
    if(P.k.shotpunch){const a0=P.aim;for(let i=-3;i<4;i++){const an=a0+i*.14;B.push({x:P.x,y:P.y,vx:Math.cos(an)*700,vy:Math.sin(an)*700,d:P.dmg*1.2,cr:0,p:1,l:.6,h:new Set(),ex:50,s:1.2,col:'#f84',rc:0})}}}
};

function drawThrust(){

  if(th){

    if(th.kind=='stab'){

      ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.moveTo(18,-1.6);ctx.lineTo(18+(th.len-18)*e,0);ctx.lineTo(18,1.6);ctx.closePath();ctx.fill();
      ctx.globalAlpha=.28*al;ctx.fillStyle=th.col;ctx.beginPath();ctx.roundRect(14,-6,(th.len-14)*e,12,6);ctx.fill();

 if(hk&&hk.t>0){const k=Math.min(1,1-hk.t/hk.m),sg=hk.h?1:-1,R=hrad()+4+Math.sin(k*Math.PI)*hk.rad*.5,cx=px,cy=py+3,

  ctx.save();ctx.lineCap='round';
  for(const[w,col,al]of[[16,'#7a1020',.35],[10,'#ff5a3a',.55],[4,'#fff1c8',.9]]){ctx.globalAlpha=al*(1-k*.4);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.arc(cx,cy,R,Math.min(a0,a1),Math.max(a0,a1));ctx.stroke()}
  ctx.globalAlpha=.7*(1-k);ctx.strokeStyle='#ffb04a';ctx.lineWidth=5*(1-k)+1;ctx.setLineDash([10,7]);ctx.beginPath();ctx.arc(cx,cy,hk.rad*(.35+.65*k),0,7);ctx.stroke();ctx.restore()}
