name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - index.html
      - manifest.webmanifest
      - icon-192.png
      - icon-512.png
      - package.json
      - capacitor.config.json
      - .github/workflows/build-apk.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy game files into www
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest icon-192.png icon-512.png www/ 2>/dev/null || true
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Lock landscape
        run: sed -i 's/android:exported="true"/android:exported="true" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patates-savasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
